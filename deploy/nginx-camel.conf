# nginx-camel.conf — Camel production site config
#
# deploy.sh generates a version of this file with the real paths and server_name
# substituted in. You can also use this template directly:
#
#   1. Copy to /etc/nginx/sites-available/camel
#   2. Replace YOUR_DOMAIN and /opt/camel with actual values
#   3. ln -s /etc/nginx/sites-available/camel /etc/nginx/sites-enabled/camel
#   4. nginx -t && systemctl reload nginx
#
# For HTTPS (recommended):
#   sudo certbot --nginx -d YOUR_DOMAIN

server {
    listen 80;
    server_name YOUR_DOMAIN _;

    # Compiled React SPA — built by deploy.sh (pnpm run build)
    root /opt/camel/frontend/dist;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # ── API routes → Encore backend on :4000 ─────────────────────────────────
    # Matches the same paths proxied in vite.config.ts (server + preview)
    location ~ ^/(auth|folders|notes|tags|shares|settings)(/|$) {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # ── Static assets — long-lived cache ─────────────────────────────────────
    location ~* \.(js|css|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback — all other routes serve index.html ─────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
